name: ULTRON protected backend checks

on:
  push:
    branches: [main, feature/pr9-protected-groq-backend]
    paths:
      - 'ULTRON-Mobile/backend/**'
      - '.github/workflows/ultron-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ULTRON-Mobile/backend/**'
      - '.github/workflows/ultron-backend.yml'
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ULTRON-Mobile/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ULTRON-Mobile/backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
