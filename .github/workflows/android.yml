name: Android security checks

on:
  push:
    branches: [main, feature/mobile-security-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        working-directory: ULTRON-Mobile
        run: gradle testDebugUnitTest
      - name: Build debug APK
        working-directory: ULTRON-Mobile
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ultron-mobile-debug
          path: ULTRON-Mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
